[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swap"
version = "0.1.0"
description = "Crash-safe, resumable folder swapping across drives when free space is tight — with CLI, terminal UI, and desktop GUI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Swappy contributors" }]
keywords = ["filesystem", "swap", "folders", "windows", "sparse-files", "crash-safe", "resumable", "cli", "tui", "gui"]
dependencies = ["rich>=13"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/your-org/swappy"
Repository = "https://github.com/your-org/swappy"
Issues = "https://github.com/your-org/swappy/issues"

# Both UIs are standard-library only, so there are no extra runtime deps.
# The terminal UI needs nothing; the desktop GUI uses Tkinter, which ships
# with the official Python installers (apt/dnf "python3-tk"/"python3-tkinter"
# on Linux).

[project.scripts]
swap = "swap.cli:main"
swap-gui = "swap.gui:main"
swap-tui = "swap.tui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "perf: performance-sensitive tests that run only with --run-perf",
]
